services:
  app:
    build: .
    container_name: media-sequencer
    ports:
      - "8080:8080"
    environment:
      PORT: 8080
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: media_sequencer
      DB_USERNAME: media_user
      DB_PASSWORD: qwerty
      FRONTEND_URL: http://localhost:5173
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16
    container_name: media-sequencer-postgres
    environment:
      POSTGRES_DB: media_sequencer
      POSTGRES_USER: media_user
      POSTGRES_PASSWORD: qwerty
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U media_user -d media_sequencer"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  postgres_data: