services:
  app:
    build: .
    container_name: media-sequencer
    ports:
      - "8080:8080"
    environment:
      PORT: 8080
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: media_sequencer
      DB_USERNAME: root
      DB_PASSWORD: qwerty
      FRONTEND_URL: http://localhost:5173
    depends_on:
      mysql:
        condition: service_healthy

  mysql:
    image: mysql:8.4
    container_name: media-sequencer-mysql
    environment:
      MYSQL_DATABASE: media_sequencer
      MYSQL_USER: media_user
      MYSQL_PASSWORD: qwerty
      MYSQL_ROOT_PASSWORD: qwerty
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "media_user", "-pchange_me"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  mysql_data:
